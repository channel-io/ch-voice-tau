[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project]
name = "tau2"
version = "0.0.1"
description = "The tau2 package"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
authors = [
    { name = "Victor Barres", email = "victor.barres@gmail.com" },
    { name = "Honghua Dong", email = "dhh19951@gmail.com" }
]
dependencies = [
    "fs",
    "rich",
    "ruff>=0.9.1",
    "watchdog>=6.0.0",
    "plotly>=6.0.0",
    "scikit-learn>=1.6.1",
    "tabulate>=0.9.0",
    "fastapi>=0.136.3",
    "uvicorn>=0.34.0",
    "pydantic-argparse>=0.10.0",
    "pytest>=9.0.3",
    "pandas>=2.2.3",
    "psutil>=7.0.0",
    "loguru>=0.7.3",
    "docstring-parser>=0.16",
    "litellm>=1.88.6",
    "tenacity>=9.0.0",
    "matplotlib>=3.10.1",
    "seaborn>=0.13.2",
    "redis>=5.2.1",
    "deepdiff>=8.6.2",
    "addict>=2.4.0",
    "PyYAML>=6.0.2",
    "toml>=0.10.2",
    "langfuse>=2.60.7",
    "openai>=2.20.0",
    "websockets>=15.0.1",
    "sounddevice>=0.5.2",
    "python-decouple>=3.8",
    # Security floors also apply to the documented pip installation path.
    "aiohttp>=3.14.4",
    "anyio>=4.14.2",
    "certifi>=2026.10.19",
    "filelock>=3.20.3",
    "fonttools>=4.60.2",
    "fsspec>=2026.6.0",
    "h11>=0.16.0",
    "idna>=3.15",
    "opentelemetry-api>=1.45.1",
    "pillow>=13.0.0",
    "protobuf>=6.33.5,<7",
    "pygments>=2.20.0",
    "python-dotenv>=1.2.2",
    "requests>=2.33.0",
    "starlette>=1.3.1",
    "urllib3>=2.8.0",
    # fs 2.4.16 still imports pkg_resources; newer setuptools needs a migration.
    "setuptools>=78.1.1,<81",
]
[project.scripts]
tau2 = "tau2.cli:main"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501", "F401", "F541"]

[tool.ruff]
line-length = 88
